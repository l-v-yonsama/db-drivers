AWSTemplateFormatVersion: '2010-09-09'
Description: Minimal offline fixture for an AWS WAF Web ACL protecting an Application Load Balancer.

# Adapted and reduced from the MIT-0 licensed AWS sample
# https://github.com/aws-samples/amazon-cloudfront-waf-secretsmanager
# This fixture keeps only the WAF-to-ALB relationship needed by diagram unit tests.
# It is not part of the LocalStack deployment validation set.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

Resources:
  ProtectedWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: protected-web-acl
        SampledRequestsEnabled: true

  UnassociatedWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: unassociated-web-acl
        SampledRequestsEnabled: true

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref SubnetIds

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 80
      Protocol: HTTP

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      WebACLArn: !GetAtt ProtectedWebAcl.Arn
      ResourceArn: !Ref ApplicationLoadBalancer
