AWSTemplateFormatVersion: '2010-09-09'
Description: Consumer stack using a parameterized ImportValue name.

Parameters:
  DataStack:
    Type: String
    Default: overridden-at-deploy-time

Resources:
  ConsumerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  ConsumerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt ConsumerFunctionRole.Arn
      Code:
        ZipFile: exports.handler = async () => undefined;
      Environment:
        Variables:
          TABLE_NAME:
            Fn::ImportValue: !Sub ${DataStack}-${AWS::Region}-TableName
